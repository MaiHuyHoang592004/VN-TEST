name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ff, POSTGRES_PASSWORD: ff, POSTGRES_DB: ff }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ff" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ff:ff@localhost:5432/ff
      SHADOW_DATABASE_URL: postgresql://ff:ff@localhost:5432/ff_shadow
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: create shadow db
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE ff_shadow;'
      - run: npm run db:validate
      - run: npm run db:migrate:deploy -w @fulfillflow/db
      - name: migration drift check
        # exit 2 is real drift; ADR-07 documents one known false-positive (the
        # fulfillment_active_queue partial index) from a Prisma diff bug. Fail
        # on anything else, but don't let that specific known non-issue redden
        # every run.
        working-directory: libs/db
        run: |
          set +e
          out="$(npx prisma migrate diff --config prisma/config/prisma.config.ts --from-migrations prisma/migrations --to-schema prisma/schema --exit-code 2>&1)"
          code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then exit 0; fi
          remainder="$(echo "$out" | grep -vE '^\s*$|^Loaded Prisma config|Changed the `Fulfillment` table|Removed index on columns \(status, dueAt\)|Added index on columns \(status, dueAt\)')"
          if [ "$code" -eq 2 ] && [ -z "$remainder" ]; then
            echo "::warning::db:diff reported only the known fulfillment_active_queue partial-index false-positive (ADR-07) — treating as pass"
            exit 0
          fi
          exit "$code"
      - run: npm run build
      - run: npm test
      - name: legacy name guard
        run: |
          ! git grep -nE "gwprint|BasketPosition|MaterialStock|WarehouseInventory" -- ':!CLAUDE.md' ':!README.md' ':!package-lock.json' ':!docs/**' ':!.github/workflows/ci.yml'
