<!-- @dsCard group="02 Colors" viewport="700x208" name="Tint ramps" subtitle="Every derived value stays on the brand's four hues" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--navy-700)}.p{padding:18px 20px}.lbl{font-family:var(--font-body);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-500);margin:0 0 7px}.mono{font-family:var(--font-mono);font-size:10px;letter-spacing:.01em;color:var(--navy-500)}body{background:var(--surface-shell)}
.ramp{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.name{width:56px;font-family:var(--font-body);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-500)}
.steps{display:flex;flex:1;gap:4px}
.s{flex:1;height:30px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;font-family:var(--font-mono);font-size:8px}</style>
</head><body>
<div class="p">
<div class="ramp"><span class="name">Sky</span><div class="steps">
<div class="s" style="background:var(--sky-50);color:var(--navy-500)">50</div><div class="s" style="background:var(--sky-100);color:var(--navy-500)">100</div><div class="s" style="background:var(--sky-200);color:var(--navy-500)">200</div><div class="s" style="background:var(--sky-300);color:var(--navy-600)">300</div><div class="s" style="background:var(--sky-400);color:var(--navy-700)">400</div><div class="s" style="background:var(--sky-500);color:#fff">500</div><div class="s" style="background:var(--sky-600);color:#fff">600</div></div></div>
<div class="ramp"><span class="name">Cream</span><div class="steps">
<div class="s" style="background:var(--cream-50);color:var(--navy-500);border:1px solid var(--border-hairline)">50</div><div class="s" style="background:var(--cream-100);color:var(--navy-500)">100</div><div class="s" style="background:var(--cream-200);color:var(--navy-500)">200</div><div class="s" style="background:var(--cream-300);color:var(--navy-500)">300</div><div class="s" style="flex:3;background:transparent"></div></div></div>
<div class="ramp"><span class="name">Navy</span><div class="steps">
<div class="s" style="background:var(--navy-100);color:var(--navy-500)">100</div><div class="s" style="background:var(--navy-200);color:var(--navy-600)">200</div><div class="s" style="background:var(--navy-300);color:#fff">300</div><div class="s" style="background:var(--navy-400);color:#fff">400</div><div class="s" style="background:var(--navy-500);color:#fff">500</div><div class="s" style="background:var(--navy-600);color:#fff">600</div><div class="s" style="background:var(--navy-700);color:#fff">700</div><div class="s" style="background:var(--navy-800);color:#fff">800</div><div class="s" style="background:var(--navy-900);color:#fff">900</div></div></div>
<div class="ramp"><span class="name">Action</span><div class="steps">
<div class="s" style="background:var(--action-100);color:var(--action-600)">100</div><div class="s" style="background:var(--action-200);color:var(--action-700)">200</div><div class="s" style="background:var(--action-500);color:#fff">500</div><div class="s" style="background:var(--action-600);color:#fff">600</div><div class="s" style="background:var(--action-700);color:#fff">700</div><div class="s" style="flex:2;background:transparent"></div></div></div>
</div></body></html>
