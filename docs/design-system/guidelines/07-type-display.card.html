<!-- @dsCard group="03 Type" viewport="700x248" name="Display — Baloo 2" subtitle="Display ink follows the surface: cream on sky, navy on cream and white" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--navy-700)}.p{padding:18px 20px}body{background:var(--surface-shell)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s{border-radius:var(--radius-lg);padding:13px 15px;min-height:74px;display:flex;flex-direction:column;justify-content:space-between}
.cap{font-family:var(--font-body);font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.d{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;line-height:1.02}
.scale{margin-top:11px;display:flex;gap:16px;flex-wrap:wrap}
.scale span{font-family:var(--font-mono);font-size:9.5px;color:var(--navy-500)}</style>
</head><body>
<div class="p"><div class="g">
<div class="s" style="background:var(--surface-canvas)"><span class="cap" style="color:var(--text-on-sky)">display on sky → cream</span><span class="d" style="font-size:38px;color:var(--display-on-sky)">Orders</span></div>
<div class="s" style="background:var(--surface-canvas)"><span class="cap" style="color:var(--text-on-sky)">brand moment → cream + white accent</span><span class="d" style="font-size:24px;color:var(--display-on-sky)">Good wood.<br><span style="color:var(--display-on-sky-bright)">Made personal.</span></span></div>
<div class="s" style="background:var(--surface-content);border:1px solid var(--border-hairline)"><span class="cap" style="color:var(--navy-500)">display on cream → navy</span><span class="d" style="font-size:32px;color:var(--display-on-cream)">Order Trend</span></div>
<div class="s" style="background:var(--surface-data);border:1px solid var(--border-hairline)"><span class="cap" style="color:var(--navy-500)">KPI number on white → navy</span><span class="d" style="font-size:32px;color:var(--display-kpi)">1,248</span></div>
</div>
<div class="scale"><span>display-2xl 64</span><span>display-xl 56</span><span>display-lg 44</span><span>display-md 32</span><span>display-sm 24</span><span>weights 700 / 800</span></div>
</div></body></html>
