<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--navy-700)}.p{padding:18px 20px}.lbl{font-family:var(--font-body);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-500);margin:0 0 7px}.mono{font-family:var(--font-mono);font-size:10px;letter-spacing:.01em;color:var(--navy-500)}body{background:var(--surface-shell)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.i{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-hairline)}
.k{font-family:var(--font-body);font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--navy-500);width:88px;flex:0 0 auto}
.v{font-family:var(--font-mono);font-size:12.5px;font-weight:500;letter-spacing:.01em;color:var(--action-600)}
.v.n{color:var(--navy-900);font-weight:600}
.no{margin-top:12px;font-family:var(--font-body);font-size:11px;color:var(--navy-500)}</style>
</head><body>
<div class="p"><div class="g">
<div class="i"><span class="k">Order ID</span><span class="v">#10429</span></div>
<div class="i"><span class="k">SKU</span><span class="v">WOD-ORN-01</span></div>
<div class="i"><span class="k">Variant</span><span class="v">TMB-20OZ-BLK</span></div>
<div class="i"><span class="k">Tracking</span><span class="v">9400 1118 9956 7890</span></div>
<div class="i"><span class="k">Amount</span><span class="v n">$2,485.50</span></div>
<div class="i"><span class="k">Ticket</span><span class="v">#9567</span></div>
</div>
<p class="no">Never set prose, labels or headings in mono. If a human wrote it, it is not mono.</p></div></body></html>
