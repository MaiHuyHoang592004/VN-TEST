<!-- @dsCard group="03 Type" viewport="700x285" name="Hierarchy in use" subtitle="Light first, data second — cream hero display, navy supporting text, pastel KPIs" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--navy-700)}.p{padding:18px 20px}body{background:var(--surface-canvas)}</style>
</head><body>
<div style="position:relative;overflow:hidden;padding:12px 20px 20px">
<div style="position:absolute;top:-110px;right:-80px;width:340px;height:340px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 16.5px,rgba(255,253,240,.32) 16.5px 18px);mask-image:radial-gradient(circle,#000 34%,transparent 100%);-webkit-mask-image:radial-gradient(circle,#000 34%,transparent 100%)"></div>

<div style="position:relative;background:var(--surface-nav);border-radius:14px;box-shadow:var(--shadow-sm);height:36px;display:flex;align-items:center;gap:8px;padding:0 14px">
<span style="font-family:var(--font-display);font-weight:800;font-size:11px;color:var(--logo-on-light)">GWP</span>
<span style="height:19px;padding:0 9px;display:inline-flex;align-items:center;border-radius:999px;background:var(--sky-200);font-family:var(--font-body);font-size:9.5px;font-weight:700;color:var(--navy-700)">Dashboard</span><span style="height:19px;padding:0 9px;display:inline-flex;align-items:center;border-radius:999px;background:transparent;font-family:var(--font-body);font-size:9.5px;font-weight:700;color:var(--navy-500)">Orders</span><span style="height:19px;padding:0 9px;display:inline-flex;align-items:center;border-radius:999px;background:transparent;font-family:var(--font-body);font-size:9.5px;font-weight:700;color:var(--navy-500)">Products</span><span style="height:19px;padding:0 9px;display:inline-flex;align-items:center;border-radius:999px;background:transparent;font-family:var(--font-body);font-size:9.5px;font-weight:700;color:var(--navy-500)">Wallet</span>
<span style="margin-left:auto;height:20px;padding:0 10px;display:inline-flex;align-items:center;border-radius:6px;background:var(--action-500);color:#fff;font-family:var(--font-body);font-size:9px;font-weight:800">New Order</span></div>

<div style="position:relative;margin-top:20px;font-family:var(--font-body);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-on-sky)">DASHBOARD</div>
<div style="position:relative;font-family:var(--font-display);font-weight:800;font-size:46px;line-height:1.02;letter-spacing:-.025em;color:var(--display-on-sky);margin-top:5px">Welcome back, Jane.</div>
<div style="position:relative;font-family:var(--font-body);font-size:13.5px;color:var(--text-on-sky-secondary);margin-top:5px">Here's what's happening with your store today.</div>

<div style="position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px">
<div style="background:var(--wash-sky);border-radius:var(--radius-lg);padding:11px 13px">
<div style="font-family:var(--font-body);font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--navy-600)">All Orders</div>
<div style="font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;letter-spacing:-.02em;color:var(--navy-600);margin-top:5px">1,248</div></div><div style="background:var(--wash-blue);border-radius:var(--radius-lg);padding:11px 13px">
<div style="font-family:var(--font-body);font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--action-600)">In Production</div>
<div style="font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;letter-spacing:-.02em;color:var(--action-600);margin-top:5px">315</div></div><div style="background:var(--wash-green);border-radius:var(--radius-lg);padding:11px 13px">
<div style="font-family:var(--font-body);font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--green-600)">Shipped</div>
<div style="font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;letter-spacing:-.02em;color:var(--green-600);margin-top:5px">865</div></div><div style="background:var(--wash-coral);border-radius:var(--radius-lg);padding:11px 13px">
<div style="font-family:var(--font-body);font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--red-600)">Delayed</div>
<div style="font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;letter-spacing:-.02em;color:var(--red-600);margin-top:5px">68</div></div>
</div></div></body></html>
