<!-- @dsCard group="04 Spacing" viewport="700x130" name="Shadow system" subtitle="Blue-tinted, wide and faint — light, never elevation drama" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--navy-700)}.p{padding:18px 20px}.lbl{font-family:var(--font-body);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-500);margin:0 0 7px}body{background:var(--surface-shell)}
.g{display:flex;gap:14px}
.c{flex:1;height:82px;background:var(--surface-data);border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.n{font-family:var(--font-body);font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--navy-500)}
.u{font-family:var(--font-body);font-size:9.5px;color:var(--navy-500)}</style>
</head><body>
<div class="p"><div class="g">
<div class="c" style="border:1px solid var(--border-hairline)"><span class="n">none</span><span class="u">flat tiles</span></div>
<div class="c" style="box-shadow:var(--shadow-xs)"><span class="n">xs</span><span class="u">cards at rest</span></div>
<div class="c" style="box-shadow:var(--shadow-sm)"><span class="n">sm</span><span class="u">surfaces</span></div>
<div class="c" style="box-shadow:var(--shadow-md)"><span class="n">md</span><span class="u">card hover</span></div>
<div class="c" style="box-shadow:var(--shadow-lg)"><span class="n">lg</span><span class="u">popovers</span></div>
<div class="c" style="box-shadow:var(--shadow-focus)"><span class="n">focus</span><span class="u">3px blue ring</span></div>
</div></div></body></html>
