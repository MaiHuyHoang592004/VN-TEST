name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The service layer is tested against a real PostgreSQL. A mocked Prisma
      # client would test the mock: unique constraints, optimistic locks and
      # transaction rollback are all behaviours of the database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orderlane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orderlane_test?schema=public

    steps:
      - uses: actions/checkout@v4
        with:
          # The clean-room gate scans commit messages as well as the tree, so
          # it needs the whole history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # First: the cheapest check, and the one whose failure means "do not
      # merge this" rather than "fix this".
      - name: Clean-room gate
        run: bash scripts/check-clean-room.sh

      - name: Validate database schema
        run: npm run validate -w @orderlane/db

      - name: Generate client and apply migrations
        run: |
          npm run generate -w @orderlane/db
          npm run db:deploy -w @orderlane/db

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
