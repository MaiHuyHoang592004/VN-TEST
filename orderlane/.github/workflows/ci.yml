name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The clean-room gate scans commit messages as well as the tree, so
          # it needs the whole history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs first: it is the cheapest check and the one whose failure means
      # "do not merge this" rather than "fix this".
      - name: Clean-room gate
        run: bash scripts/check-clean-room.sh

      - name: Validate database schema
        run: npm run validate -w @orderlane/db

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
